<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#28a9ff"
    >

    <title>SUNSTER'S | Panel del servidor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top,
                    #102c4a 0%,
                    #07111d 45%,
                    #04080d 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .card {
            width: min(520px, 90%);

            padding: 35px;

            border-radius: 22px;

            background: rgba(10, 20, 32, 0.92);

            border: 1px solid rgba(40, 169, 255, 0.25);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;

            margin-bottom: 25px;

            color: #28a9ff;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        .description {
            color: #9eabb8;
            margin-bottom: 28px;
        }

        .server {
            padding: 20px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .server-name {
            font-size: 20px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .server-id {
            color: #8b98a5;
            font-size: 13px;

            word-break: break-all;
        }

        .status {
            margin-top: 20px;

            color: #63d68a;

            font-weight: 600;
        }

        .back {
            display: inline-block;

            margin-top: 25px;

            padding: 12px 20px;

            border-radius: 10px;

            background: #28a9ff;
            color: white;

            text-decoration: none;

            font-weight: 700;

            transition: 0.2s;
        }

        .back:hover {
            transform: translateY(-2px);

            filter: brightness(1.1);
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">
            SUNSTER'S
        </div>

        <h1>
            Panel del servidor
        </h1>

        <p class="description">
            Has seleccionado correctamente este servidor.
        </p>

        <section class="server">

            <div
                class="server-name"
                id="serverName"
            >
                Cargando...
            </div>

            <div
                class="server-id"
                id="serverId"
            >
                Cargando ID...
            </div>

            <div class="status">
                🟢 Página cargada correctamente
            </div>

        </section>

        <a
            class="back"
            href="../"
        >
            ← Volver al Dashboard
        </a>

    </main>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const guildId =
            params.get("guild");

        const serverName =
            document.getElementById(
                "serverName"
            );

        const serverId =
            document.getElementById(
                "serverId"
            );

        if (!guildId) {

            serverName.textContent =
                "Ningún servidor seleccionado";

            serverId.textContent =
                "Falta el parámetro guild";

        } else {

            serverName.textContent =
                "Servidor seleccionado";

            serverId.textContent =
                "ID: " + guildId;

        }

    </script>

</body>
</html>
